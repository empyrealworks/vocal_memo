<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found – Vocal Memo</title>
  <meta name="robots" content="noindex">

  <!-- Favicons & Manifest -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="manifest" href="images/site.webmanifest">
  <link rel="shortcut icon" href="images/favicon.ico">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #212222, #1A1A1A);
      color: rgba(255,255,255,0.85);
      line-height: 1.7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(108, 214, 206, 0.22);
      border-radius: 28px;
    }
    h2 {
      color: #6CD6CE;
      font-size: 5rem;
      font-weight: 700;
      margin-bottom: 0;
      line-height: 1;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    p {
      color: rgba(255,255,255,0.6);
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #6CD6CE, #F86E01);
      color: #000;
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(248, 110, 1, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>404</h2>
    <h1>Page Not Found</h1>
    <p>Oops! The page you are looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn">Return Home</a>
  </div>
</body>
</html>
